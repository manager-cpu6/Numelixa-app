name: Ebirr Numelixa Admin APK
'on':
  push:
    branches: [feat/ebirr-numelixa-admin-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin:
    name: Build isolated Ebirr-Numelixa Admin APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate Admin-only Android platform files
        shell: bash
        run: |
          flutter create --platforms=android --org com.numelixa --project-name app .
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          for permission in ['android.permission.POST_NOTIFICATIONS', 'android.permission.READ_SMS', 'android.permission.RECEIVE_SMS']:
              tag = f'    <uses-permission android:name="{permission}"/>'
              if permission not in s:
                  s = s.replace('<application', tag + '\\n    <application', 1)
          s = s.replace('android:label="app"', 'android:label="Ebirr-Numelixa Admin"')
          s = s.replace('android:name=".MainActivity"', 'android:name="com.numelixa.app.MainActivity"')
          manifest.write_text(s)
          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          if 'applicationId = "com.numelixa.app"' not in g:
              raise SystemExit('Expected default customer namespace was not generated.')
          g = g.replace('applicationId = "com.numelixa.app"', 'applicationId = "com.numelixa.admin"', 1)
          if 'import java.util.Properties' not in g:
              g = 'import java.util.Properties\\n' + g
          if 'create("release")' not in g:
              signing = '''    signingConfigs {
                  create("release") {
                      val propsFile = rootProject.file("key.properties")
                      if (propsFile.exists()) {
                          val props = Properties()
                          propsFile.inputStream().use { props.load(it) }
                          storeFile = file(props["storeFile"] as String)
                          storePassword = props["storePassword"] as String
                          keyAlias = props["keyAlias"] as String
                          keyPassword = props["keyPassword"] as String
                      }
                  }
              }
          '''
              g = g.replace('    buildTypes {', signing + '    buildTypes {', 1)
          g = g.replace('signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = if (rootProject.file("key.properties").exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")')
          if 'isCoreLibraryDesugaringEnabled = true' not in g:
              g = g.replace('    compileOptions {', '    compileOptions {\\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in g:
              g += '\\ndependencies {\\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\\n}\\n'
          gradle.write_text(g)
          gp = Path('android/gradle.properties')
          props = gp.read_text() if gp.exists() else ''
          if 'android.newDsl=false' not in props:
              gp.write_text(props + '\\nandroid.newDsl=false\\n')
          candidates = list(Path('android/app/src/main/kotlin').rglob('MainActivity.kt'))
          if not candidates:
              raise SystemExit('Flutter MainActivity.kt was not generated.')
          activity = candidates[0]
          activity.write_text('''package com.numelixa.app

          import android.Manifest
          import android.content.pm.PackageManager
          import android.provider.Telephony
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterFragmentActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.numelixa/ebirr_sms")
                      .setMethodCallHandler { call, result ->
                          if (call.method != "readRecentSms") {
                              result.notImplemented()
                          } else if (checkSelfPermission(Manifest.permission.READ_SMS) != PackageManager.PERMISSION_GRANTED) {
                              result.error("permission_denied", "SMS permission is required.", null)
                          } else {
                              try {
                                  val after = (call.argument<Number>("after") ?: 0).toLong()
                                  val limit = ((call.argument<Number>("limit") ?: 80).toInt()).coerceIn(1, 100)
                                  val rows = mutableListOf<Map<String, Any?>>()
                                  val columns = arrayOf(Telephony.Sms._ID, Telephony.Sms.ADDRESS, Telephony.Sms.BODY, Telephony.Sms.DATE, Telephony.Sms.SUBSCRIPTION_ID)
                                  contentResolver.query(
                                      Telephony.Sms.Inbox.CONTENT_URI,
                                      columns,
                                      "${Telephony.Sms.DATE} > ?",
                                      arrayOf(after.toString()),
                                      "${Telephony.Sms.DATE} ASC"
                                  )?.use { cursor ->
                                      val idCol = cursor.getColumnIndex(Telephony.Sms._ID)
                                      val addressCol = cursor.getColumnIndex(Telephony.Sms.ADDRESS)
                                      val bodyCol = cursor.getColumnIndex(Telephony.Sms.BODY)
                                      val dateCol = cursor.getColumnIndex(Telephony.Sms.DATE)
                                      val subCol = cursor.getColumnIndex(Telephony.Sms.SUBSCRIPTION_ID)
                                      while (cursor.moveToNext() && rows.size < limit) {
                                          rows.add(mapOf(
                                              "id" to if (idCol >= 0) cursor.getString(idCol) else "",
                                              "address" to if (addressCol >= 0) cursor.getString(addressCol) else "",
                                              "body" to if (bodyCol >= 0) cursor.getString(bodyCol) else "",
                                              "date" to if (dateCol >= 0) cursor.getLong(dateCol) else 0L,
                                              "subscriptionId" to if (subCol >= 0) cursor.getInt(subCol) else -1
                                          ))
                                      }
                                  }
                                  result.success(rows)
                              } catch (error: Exception) {
                                  result.error("sms_read_failed", error.message ?: "Could not read SMS inbox.", null)
                              }
                          }
                      }
              }
          }
          ''')
          PY
      - name: Install Numelixa admin launcher icon
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Image.open('assets/numelixa_icon_source.jpg').convert('RGBA')
          if source.size != (256, 256):
              raise SystemExit(f'Unexpected source icon dimensions: {source.size}')
          res = Path('android/app/src/main/res')
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              source.resize((size,size), Image.Resampling.LANCZOS).save(folder / 'ic_launcher.png', optimize=True)
          foreground = Image.new('RGBA',(432,432),(0,0,0,0))
          artwork = source.resize((284,284), Image.Resampling.LANCZOS)
          foreground.alpha_composite(artwork,((432-284)//2,(432-284)//2))
          drawable = res / 'drawable-nodpi'
          drawable.mkdir(parents=True, exist_ok=True)
          foreground.save(drawable / 'numelixa_launcher.png', optimize=True)
          adaptive = res / 'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / 'ic_launcher.xml').write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/numelixa_icon_background"/>
              <foreground android:drawable="@drawable/numelixa_launcher"/>
          </adaptive-icon>''')
          values = res / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values / 'numelixa_icon_colors.xml').write_text('<resources><color name="numelixa_icon_background">#000000</color></resources>')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in text:
              text = text.replace('<application', '<application android:icon="@mipmap/ic_launcher"', 1)
          manifest.write_text(text)
          PY
      - name: Install notification status icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_numelixa.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.6" android:pathData="M12,2.2 A9.8,9.8 0,1 0,12 21.8 A9.8,9.8 0,1 0,12 2.2 Z"/>
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2.5" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M6.3,16.8 L8.7,7.3 C9,6.2 10.2,6 10.9,7 L14.2,12 C14.8,12.9 15.5,13.3 16.2,12.8 C16.9,12.4 17.2,11.6 17.4,10.4"/>
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          meta = '<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_numelixa"/>'
          if 'com.google.firebase.messaging.default_notification_icon' not in s:
              start = s.find('<application')
              end = s.find('>', start)
              if start < 0 or end < 0:
                  raise SystemExit('Could not locate Android application manifest element.')
              s = s[:end + 1] + '\\n        ' + meta + s[end + 1:]
          p.write_text(s)
          PY
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_B64_PART1: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART1 }}
          KEYSTORE_B64_PART2: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART2 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64_PART1" ] || [ -n "$KEYSTORE_B64_PART2" ]; then
            if [ -z "$KEYSTORE_B64_PART1" ] || [ -z "$KEYSTORE_B64_PART2" ]; then
              echo "::error::Both keystore Base64 parts are required."
              exit 1
            fi
            printf '%s%s' "$KEYSTORE_B64_PART1" "$KEYSTORE_B64_PART2" | tr -d '[:space:]' > /tmp/keystore.base64
          else
            if [ -z "$KEYSTORE_B64" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is required."
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' > /tmp/keystore.base64
          fi
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          raw = Path('/tmp/keystore.base64').read_bytes()
          decoded = base64.b64decode(raw, validate=True)
          if not decoded:
              raise SystemExit('Decoded keystore is empty.')
          Path('android/release-key.jks').write_bytes(decoded)
          PY
          keytool -list -keystore android/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release-key.jks
          EOF
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build Ebirr-Numelixa Admin APK
        run: flutter build apk --release --target lib/ebirr_admin_main.dart --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Name and verify Admin APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Ebirr-Numelixa-Admin.apk
          test -s build/app/outputs/flutter-apk/Ebirr-Numelixa-Admin.apk
          ls -lh build/app/outputs/flutter-apk/Ebirr-Numelixa-Admin.apk
      - name: Upload Admin APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebirr-numelixa-admin-apk
          path: build/app/outputs/flutter-apk/Ebirr-Numelixa-Admin.apk
          if-no-files-found: error
          retention-days: 30
