name: Numelixa Android CI
on:
  pull_request:
    branches: [main]
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/flutter-ci.yml'
  push:
    branches: ['**']
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/flutter-ci.yml'
permissions:
  contents: read
concurrency:
  group: numelixa-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Tests
        run: flutter test --no-pub
      - name: Generate Android platform files
        run: flutter create --platforms=android .
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      - name: Upload CI APK
        uses: actions/upload-artifact@v4
        with:
          name: numelixa-android-ci-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
