name: Numelixa Android CI
'on':
  push:
    branches: [main, feat/native-commerce-auth-notifications, fix/google-fcm-orders-account, support-chat-upgrade]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android platform files
        shell: bash
        run: |
          flutter create --platforms=android --org com.numelixa --project-name app .
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path('android/app/src/main/kotlin').rglob('MainActivity.kt')) + list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          for activity in candidates:
              text = activity.read_text()
              if activity.suffix == '.kt' and 'FlutterActivity' in text and 'FlutterFragmentActivity' not in text:
                  text = text.replace('import io.flutter.embedding.android.FlutterActivity', 'import io.flutter.embedding.android.FlutterFragmentActivity')
                  text = text.replace('FlutterActivity()', 'FlutterFragmentActivity()')
                  activity.write_text(text)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          s = s.replace('android:label="app"', 'android:label="Numelixa"')
          # Receive the short-lived, one-time OAuth ticket returned by the
          # production website after Google verifies the chosen account.
          if 'android:scheme="com.numelixa.app"' not in s:
              callback = '''            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.numelixa.app" android:host="auth" android:path="/callback" />
                      </intent-filter>'''
              s = s.replace('android:exported="true">', 'android:exported="true">\n' + callback, 1)
          p.write_text(s)
          g = Path('android/app/build.gradle.kts')
          s = g.read_text()
          if 'import java.util.Properties' not in s:
              s = 'import java.util.Properties\n' + s
          if 'create("release")' not in s:
              marker = '    buildTypes {'
              signing = '''    signingConfigs {
                  create("release") {
                      val propsFile = rootProject.file("key.properties")
                      if (propsFile.exists()) {
                          val props = Properties()
                          propsFile.inputStream().use { props.load(it) }
                          storeFile = file(props["storeFile"] as String)
                          storePassword = props["storePassword"] as String
                          keyAlias = props["keyAlias"] as String
                          keyPassword = props["keyPassword"] as String
                      }
                  }
              }
          '''
              s = s.replace(marker, signing + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = if (rootProject.file("key.properties").exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")')
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace('    compileOptions {', '    compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          g.write_text(s)
          gp = Path('android/gradle.properties')
          properties = gp.read_text() if gp.exists() else ''
          if 'android.newDsl=false' not in properties:
              gp.write_text(properties + '\nandroid.newDsl=false\n')
          PY
      - name: Install Numelixa launcher icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp android/numelixa_icon.xml android/app/src/main/res/drawable/numelixa_launcher.xml
          python3 - <<'PY'
          from pathlib import Path
          res = Path('android/app/src/main/res')
          vector = (res / 'drawable/numelixa_launcher.xml').read_text()
          # flutter create already generates density-specific ic_launcher.png files.
          # Do not create same-name XML resources in those folders: Android treats
          # ic_launcher.xml + ic_launcher.png in one density as duplicate resources.
          # Keep the vector as the adaptive icon foreground and use the existing PNGs
          # for legacy launcher resource fallbacks.
          adaptive = '''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/numelixa_icon_background"/>
              <foreground android:drawable="@drawable/numelixa_launcher"/>
          </adaptive-icon>'''
          (res / 'mipmap-anydpi-v26/ic_launcher.xml').write_text(adaptive)
          colors = res / 'values'
          colors.mkdir(parents=True, exist_ok=True)
          (colors / 'numelixa_icon_colors.xml').write_text(
              '<resources><color name="numelixa_icon_background">#030817</color></resources>')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in content:
              content = content.replace('<application', '<application android:icon="@mipmap/ic_launcher"', 1)
          content = content.replace('android:label="app"', 'android:label="Numelixa"')
          manifest.write_text(content)
          PY
      - name: Configure Firebase (optional)
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_CONFIG_B64" ]; then
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is required for the verified release build."
            exit 1
          fi
          echo "$FIREBASE_CONFIG_B64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('android/app/google-services.json')
          data = json.loads(p.read_text())
          ids = {c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in data.get('client', [])}
          if 'com.numelixa.app' not in ids:
              raise SystemExit('Firebase config must contain package com.numelixa.app; found: ' + str(ids))
          matching = [c for c in data.get('client', [])
                      if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.numelixa.app']
          oauth = [o for c in matching for o in c.get('oauth_client', [])]
          types = {str(o.get('client_type')) for o in oauth}
          if '1' not in types or '3' not in types:
              raise SystemExit(
                  'Firebase config is stale/incomplete: com.numelixa.app must include both Android OAuth client_type 1 and Web OAuth client_type 3. '
                  'Re-download google-services.json after registering the release SHA-1 and Web OAuth client, then update GitHub secret FIREBASE_GOOGLE_SERVICES_JSON_BASE64.'
              )
          android_clients = [o for o in oauth if str(o.get('client_type')) == '1']
          web_clients = [o for o in oauth if str(o.get('client_type')) == '3']
          malformed = [o.get('client_id', '') for o in android_clients + web_clients
                       if not str(o.get('client_id', '')).endswith('.apps.googleusercontent.com')]
          if malformed:
              raise SystemExit(
                  'Firebase OAuth client ID is malformed: every Android/Web OAuth client must end with '
                  '".apps.googleusercontent.com". Found invalid client ID(s): ' + ', '.join(map(str, malformed)) +
                  '. Download a fresh google-services.json from Firebase Console and update FIREBASE_GOOGLE_SERVICES_JSON_BASE64.'
              )
          g = Path('android/app/build.gradle.kts')
          s = g.read_text()
          marker = '    id("com.android.application")'
          if 'com.google.gms.google-services' not in s:
              s = s.replace(marker, marker + '\n    id("com.google.gms.google-services") version "4.4.2"', 1)
          g.write_text(s)
          PY
      - name: Configure release signing (optional)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_B64_PART1: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART1 }}
          KEYSTORE_B64_PART2: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART2 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          # Prefer two-part secrets to avoid mobile clipboard truncation. Otherwise use the original full secret.
          if [ -n "$KEYSTORE_B64_PART1" ] || [ -n "$KEYSTORE_B64_PART2" ]; then
            if [ -z "$KEYSTORE_B64_PART1" ] || [ -z "$KEYSTORE_B64_PART2" ]; then
              echo "::error::Both ANDROID_KEYSTORE_BASE64_PART1 and ANDROID_KEYSTORE_BASE64_PART2 must be set."
              exit 1
            fi
            printf '%s%s' "$KEYSTORE_B64_PART1" "$KEYSTORE_B64_PART2" | tr -d '[:space:]' > /tmp/keystore.base64
          else
            if [ -z "$KEYSTORE_B64" ]; then
              echo "::error::Set ANDROID_KEYSTORE_BASE64 or both split keystore secrets."
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' > /tmp/keystore.base64
          fi
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import sys
          raw = Path('/tmp/keystore.base64').read_bytes()
          invalid = sum(c not in b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=' for c in raw)
          print(f'Keystore Base64 diagnostics: characters={len(raw)}, invalid_characters={invalid}, length_mod_4={len(raw) % 4}')
          try:
              decoded = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit(f'ANDROID_KEYSTORE_BASE64 is malformed after GitHub provides it ({type(exc).__name__}). Re-copy the complete base64 file into this exact repository Actions secret.')
          if not decoded:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 decoded to an empty file.')
          Path('android/release-key.jks').write_bytes(decoded)
          PY
          if ! keytool -list -keystore android/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            rm -f android/release-key.jks
            echo "::error::Signing keystore could not be opened. Recreate ANDROID_KEYSTORE_BASE64 from the original .jks file and verify the keystore password and alias."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release-key.jks
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Diagnose Android OAuth signing configuration
        if: steps.signing.outputs.configured == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          echo "Release signing certificate SHA-1 (must be registered in Firebase Android OAuth):"
          keytool -list -v -keystore android/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E 'SHA1:|SHA-1:'
          RELEASE_SHA1="$(keytool -list -v -keystore android/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk '/SHA1:|SHA-1:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          RELEASE_SHA1="$RELEASE_SHA1" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data=json.loads(Path('android/app/google-services.json').read_text())
          release_sha1=os.environ['RELEASE_SHA1']
          matching=[c for c in data.get('client', [])
                    if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.numelixa.app']
          android_clients=[o for c in matching for o in c.get('oauth_client', []) if str(o.get('client_type')) == '1']
          print('OAuth clients bundled in Firebase config:')
          for client in matching:
              for oauth in client.get('oauth_client', []):
                  print('package=com.numelixa.app client_type=' + str(oauth.get('client_type')) + ' client_id=' + str(oauth.get('client_id', '')))
          configured={str(o.get('android_info', {}).get('certificate_hash', '')).replace(':', '').lower() for o in android_clients}
          if release_sha1 not in configured:
              raise SystemExit(
                  'Firebase google-services.json SHA-1 does not match the actual release keystore. '
                  'Actual release SHA-1: ' + release_sha1 + '. Register this SHA-1 in Firebase for com.numelixa.app, then download and update FIREBASE_GOOGLE_SERVICES_JSON_BASE64.'
              )
          print('Firebase Android OAuth SHA-1 matches the configured release signing key.')
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Build release APK
        run: flutter build apk --release --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Rename release APK for public downloads and updates
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Numelixa.apk
      - name: Build AAB
        run: flutter build appbundle --release --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: numelixa-android-builds
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/Numelixa.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Read app version for release metadata
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '"' | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Remove stale legacy APK from rolling release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'android-latest' }}"
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)"
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "app-release.apk") | .id' |
            while read -r ASSET_ID; do
              [ -n "$ASSET_ID" ] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
              echo "Removed stale legacy APK asset $ASSET_ID"
            done
          fi
      - name: Publish GitHub release assets
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'android-latest' }}
          target_commitish: ${{ github.sha }}
          name: Numelixa Android ${{ steps.app_version.outputs.version }}
          make_latest: true
          generate_release_notes: false
          overwrite_files: true
          body: |
            Numelixa — Global Virtual Numbers

            This release includes the Help Team Chat experience, improved automatic update discovery, and a more reliable mobile experience.

            Download Numelixa.apk to install or update the Android app. Push notification delivery remains enabled.
          files: |
            build/app/outputs/flutter-apk/Numelixa.apk
            build/app/outputs/bundle/release/app-release.aab
