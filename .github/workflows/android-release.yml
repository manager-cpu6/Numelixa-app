name: Numelixa Android CI
'on':
  push:
    branches: [main, feat/native-commerce-auth-notifications, fix/google-fcm-orders-account]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android platform files
        shell: bash
        run: |
          flutter create --platforms=android --org com.numelixa --project-name app .
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path('android/app/src/main/kotlin').rglob('MainActivity.kt')) + list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          for activity in candidates:
              text = activity.read_text()
              if activity.suffix == '.kt' and 'FlutterActivity' in text and 'FlutterFragmentActivity' not in text:
                  text = text.replace('import io.flutter.embedding.android.FlutterActivity', 'import io.flutter.embedding.android.FlutterFragmentActivity')
                  text = text.replace('FlutterActivity()', 'FlutterFragmentActivity()')
                  activity.write_text(text)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          s = s.replace('android:label="app"', 'android:label="Numelixa"')
          # Receive the short-lived, one-time OAuth ticket returned by the
          # production website after Google verifies the chosen account.
          if 'android:scheme="com.numelixa.app"' not in s:
              callback = '''            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.numelixa.app" android:host="auth" android:path="/callback" />
                      </intent-filter>'''
              s = s.replace('android:exported="true">', 'android:exported="true">\n' + callback, 1)
          p.write_text(s)
          g = Path('android/app/build.gradle.kts')
          s = g.read_text()
          if 'import java.util.Properties' not in s:
              s = 'import java.util.Properties\n' + s
          if 'create("release")' not in s:
              marker = '    buildTypes {'
              signing = '''    signingConfigs {
                  create("release") {
                      val propsFile = rootProject.file("key.properties")
                      if (propsFile.exists()) {
                          val props = Properties()
                          propsFile.inputStream().use { props.load(it) }
                          storeFile = file(props["storeFile"] as String)
                          storePassword = props["storePassword"] as String
                          keyAlias = props["keyAlias"] as String
                          keyPassword = props["keyPassword"] as String
                      }
                  }
              }
          '''
              s = s.replace(marker, signing + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = if (rootProject.file("key.properties").exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")')
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace('    compileOptions {', '    compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          g.write_text(s)
          gp = Path('android/gradle.properties')
          properties = gp.read_text() if gp.exists() else ''
          if 'android.newDsl=false' not in properties:
              gp.write_text(properties + '\nandroid.newDsl=false\n')
          PY
      - name: Configure Firebase (optional)
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_CONFIG_B64" ]; then
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is required for the verified release build."
            exit 1
          fi
          echo "$FIREBASE_CONFIG_B64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('android/app/google-services.json')
          data = json.loads(p.read_text())
          ids = {c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in data.get('client', [])}
          if 'com.numelixa.app' not in ids:
              raise SystemExit('Firebase config must contain package com.numelixa.app; found: ' + str(ids))
          matching = [c for c in data.get('client', [])
                      if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.numelixa.app']
          oauth = [o for c in matching for o in c.get('oauth_client', [])]
          types = {str(o.get('client_type')) for o in oauth}
          if '1' not in types or '3' not in types:
              raise SystemExit(
                  'Firebase config is stale/incomplete: com.numelixa.app must include both Android OAuth client_type 1 and Web OAuth client_type 3. '
                  'Re-download google-services.json after registering the release SHA-1 and Web OAuth client, then update GitHub secret FIREBASE_GOOGLE_SERVICES_JSON_BASE64.'
              )
          android_clients = [o for o in oauth if str(o.get('client_type')) == '1']
          expected_sha1 = '69ce75089a191ac41ff96b0498bdfa002a00a910'
          if not any(str(o.get('android_info', {}).get('certificate_hash', '')).replace(':', '').lower() == expected_sha1
                     for o in android_clients):
              raise SystemExit(
                  'Firebase config Android OAuth client does not contain the release signing SHA-1 used by this repository. '
                  'Register the release SHA-1 shown in the Diagnose Android OAuth signing configuration step and download a fresh google-services.json.'
              )
          g = Path('android/app/build.gradle.kts')
          s = g.read_text()
          marker = '    id("com.android.application")'
          if 'com.google.gms.google-services' not in s:
              s = s.replace(marker, marker + '\n    id("com.google.gms.google-services") version "4.4.2"', 1)
          g.write_text(s)
          PY
      - name: Configure release signing (optional)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_B64_PART1: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART1 }}
          KEYSTORE_B64_PART2: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART2 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          # Prefer two-part secrets to avoid mobile clipboard truncation. Otherwise use the original full secret.
          if [ -n "$KEYSTORE_B64_PART1" ] || [ -n "$KEYSTORE_B64_PART2" ]; then
            if [ -z "$KEYSTORE_B64_PART1" ] || [ -z "$KEYSTORE_B64_PART2" ]; then
              echo "::error::Both ANDROID_KEYSTORE_BASE64_PART1 and ANDROID_KEYSTORE_BASE64_PART2 must be set."
              exit 1
            fi
            printf '%s%s' "$KEYSTORE_B64_PART1" "$KEYSTORE_B64_PART2" | tr -d '[:space:]' > /tmp/keystore.base64
          else
            if [ -z "$KEYSTORE_B64" ]; then
              echo "::error::Set ANDROID_KEYSTORE_BASE64 or both split keystore secrets."
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' > /tmp/keystore.base64
          fi
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import sys
          raw = Path('/tmp/keystore.base64').read_bytes()
          invalid = sum(c not in b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=' for c in raw)
          print(f'Keystore Base64 diagnostics: characters={len(raw)}, invalid_characters={invalid}, length_mod_4={len(raw) % 4}')
          try:
              decoded = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit(f'ANDROID_KEYSTORE_BASE64 is malformed after GitHub provides it ({type(exc).__name__}). Re-copy the complete base64 file into this exact repository Actions secret.')
          if not decoded:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 decoded to an empty file.')
          Path('android/release-key.jks').write_bytes(decoded)
          PY
          if ! keytool -list -keystore android/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            rm -f android/release-key.jks
            echo "::error::Signing keystore could not be opened. Recreate ANDROID_KEYSTORE_BASE64 from the original .jks file and verify the keystore password and alias."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release-key.jks
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Diagnose Android OAuth signing configuration
        if: steps.signing.outputs.configured == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          echo "Release signing certificate SHA-1 (add this to the Android OAuth client if missing):"
          keytool -list -v -keystore android/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E 'SHA1:|SHA-1:'
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('android/app/google-services.json').read_text())
          print('OAuth clients bundled in Firebase config:')
          for client in data.get('client', []):
              package=client.get('client_info', {}).get('android_client_info', {}).get('package_name', '')
              for oauth in client.get('oauth_client', []):
                  print('package=' + str(package) + ' client_type=' + str(oauth.get('client_type')) + ' client_id=' + str(oauth.get('client_id', '')))
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Build release APK
        run: flutter build apk --release --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Build AAB
        run: flutter build appbundle --release --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: numelixa-android-builds
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release assets
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'android-latest' }}
          target_commitish: ${{ github.sha }}
          name: Numelixa Android ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest verified build' }}
          make_latest: true
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
