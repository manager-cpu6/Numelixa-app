name: Numelixa Flutter Android Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android project
        shell: bash
        run: |
          flutter create --platforms=android --org com.numelixa --project-name app /tmp/numelixa-platform
          rm -rf android
          cp -R /tmp/numelixa-platform/android ./android
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          if "android.permission.POST_NOTIFICATIONS" not in text:
              text = text.replace("<application", permission + "\\n    <application", 1)
          text = text.replace('android:label="app"', 'android:label="Numelixa"')
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/numelixa_icon"')
          manifest.write_text(text)
          icon_dir = Path("android/app/src/main/res/drawable")
          icon_dir.mkdir(parents=True, exist_ok=True)
          icon_dir.joinpath("numelixa_icon.xml").write_text(Path("assets/numelixa_icon.xml").read_text())

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          marker = "    buildTypes {"
          signing = """    signingConfigs {
              create("release") {
                  val propsFile = rootProject.file("key.properties")
                  if (propsFile.exists()) {
                      val props = java.util.Properties()
                      propsFile.inputStream().use { props.load(it) }
                      storeFile = file(props["storeFile"] as String)
                      storePassword = props["storePassword"] as String
                      keyAlias = props["keyAlias"] as String
                      keyPassword = props["keyPassword"] as String
                  }
              }
          }

          """
          if "create(\\"release\\")" not in text:
              text = text.replace(marker, signing + marker, 1)
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = if (rootProject.file("key.properties").exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")'
          )
          gradle.write_text(text)
          PY
      - name: Configure Firebase (optional)
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_CONFIG_B64" ]; then
            echo "Firebase secret not configured; builds will run without push delivery."
            exit 0
          fi
          echo "$FIREBASE_CONFIG_B64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          package_ids = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in config.get("client", [])
          }
          if "com.numelixa.app" not in package_ids:
              raise SystemExit("Firebase config must contain package com.numelixa.app; found " + str(package_ids))
          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          marker = '    id("com.android.application")'
          if 'com.google.gms.google-services' not in text:
              text = text.replace(marker, marker + '\\n    id("com.google.gms.google-services") version "4.4.2"', 1)
          gradle.write_text(text)
          PY
      - name: Configure release signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release keystore supplied; release build uses the debug key and is for testing only."
            exit 0
          fi
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-key.jks
          EOF
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Build release APK
        run: flutter build apk --release --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Build Android App Bundle
        run: flutter build appbundle --release --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - uses: actions/upload-artifact@v4
        with:
          name: numelixa-android-builds
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
