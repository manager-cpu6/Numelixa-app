name: Numelixa Android CI
'on':
  push:
    branches: [main, feat/native-commerce-auth-notifications, fix/google-fcm-orders-account, support-chat-upgrade, feat/numelixa-premium-mobile-upgrade, feat/numelixa-major-brand-security-2026, feat/exact-brand-icon-native-login, feat/reliable-inplace-updates-2026, feat/numelixa-liquid-glass-refresh, feat/wallet-somalia-crypto-receipts-premium]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: numelixa-android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate Android platform files
        shell: bash
        run: |
          flutter create --platforms=android --org com.numelixa --project-name app .
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path('android/app/src/main/kotlin').rglob('MainActivity.kt')) + list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          for activity in candidates:
              text = activity.read_text()
              if activity.suffix == '.kt' and 'FlutterActivity' in text and 'FlutterFragmentActivity' not in text:
                  text = text.replace('import io.flutter.embedding.android.FlutterActivity', 'import io.flutter.embedding.android.FlutterFragmentActivity')
                  text = text.replace('FlutterActivity()', 'FlutterFragmentActivity()')
                  activity.write_text(text)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          install_permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>'
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in s:
              s = s.replace('<application', install_permission + '\n    <application', 1)
          # Use the real Numelixa monochrome status icon for Firebase-rendered background notifications.
          notification_meta = '''        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_numelixa" />
                  <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="general" />'''
          if 'com.google.firebase.messaging.default_notification_icon' not in s:
              s = s.replace('</application>', notification_meta + '\n    </application>', 1)
          s = s.replace('android:label="app"', 'android:label="Numelixa"')
          # Receive the short-lived, one-time OAuth ticket returned by the
          # production website after Google verifies the chosen account.
          if 'android:scheme="com.numelixa.app"' not in s:
              callback = '''            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.numelixa.app" android:host="auth" android:path="/callback" />
                      </intent-filter>'''
              s = s.replace('android:exported="true">', 'android:exported="true">\n' + callback, 1)
          p.write_text(s)
          g = Path('android/app/build.gradle.kts')
          s = g.read_text()
          if 'import java.util.Properties' not in s:
              s = 'import java.util.Properties\n' + s
          if 'create("release")' not in s:
              marker = '    buildTypes {'
              signing = '''    signingConfigs {
                  create("release") {
                      val propsFile = rootProject.file("key.properties")
                      if (propsFile.exists()) {
                          val props = Properties()
                          propsFile.inputStream().use { props.load(it) }
                          storeFile = file(props["storeFile"] as String)
                          storePassword = props["storePassword"] as String
                          keyAlias = props["keyAlias"] as String
                          keyPassword = props["keyPassword"] as String
                      }
                  }
              }
          '''
              s = s.replace(marker, signing + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = if (rootProject.file("key.properties").exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")')
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace('    compileOptions {', '    compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          g.write_text(s)
          gp = Path('android/gradle.properties')
          properties = gp.read_text() if gp.exists() else ''
          if 'android.newDsl=false' not in properties:
              gp.write_text(properties + '\nandroid.newDsl=false\n')
          PY
      - name: Install exact Numelixa PNG launcher icon
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Image.open('assets/numelixa_icon_source.jpg').convert('RGBA')
          if source.size != (256, 256):
              raise SystemExit(f'Unexpected source icon dimensions: {source.size}')
          res = Path('android/app/src/main/res')
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              source.resize((size,size), Image.Resampling.LANCZOS).save(folder / 'ic_launcher.png', optimize=True)
          # Adaptive icon foreground keeps the complete original artwork inside Android's safe mask.
          foreground = Image.new('RGBA',(432,432),(0,0,0,0))
          artwork = source.resize((284,284), Image.Resampling.LANCZOS)
          foreground.alpha_composite(artwork,((432-284)//2,(432-284)//2))
          drawable = res / 'drawable-nodpi'
          drawable.mkdir(parents=True, exist_ok=True)
          foreground.save(drawable / 'numelixa_launcher.png', optimize=True)
          adaptive_dir = res / 'mipmap-anydpi-v26'
          adaptive_dir.mkdir(parents=True, exist_ok=True)
          (adaptive_dir / 'ic_launcher.xml').write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/numelixa_icon_background"/>
              <foreground android:drawable="@drawable/numelixa_launcher"/>
          </adaptive-icon>''')
          colors = res / 'values'
          colors.mkdir(parents=True, exist_ok=True)
          (colors / 'numelixa_icon_colors.xml').write_text('<resources><color name="numelixa_icon_background">#000000</color></resources>')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in content:
              content = content.replace('<application', '<application android:icon="@mipmap/ic_launcher"', 1)
          content = content.replace('android:label="app"', 'android:label="Numelixa"')
          manifest.write_text(content)
          PY
      - name: Install Numelixa notification status icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_numelixa.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.6" android:pathData="M12,2.2 A9.8,9.8 0,1 0,12 21.8 A9.8,9.8 0,1 0,12 2.2 Z"/>
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2.5" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M6.3,16.8 L8.7,7.3 C9,6.2 10.2,6 10.9,7 L14.2,12 C14.8,12.9 15.5,13.3 16.2,12.8 C16.9,12.4 17.2,11.6 17.4,10.4"/>
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.2" android:strokeLineCap="round" android:pathData="M2.2,13.1 C6.2,8.6 11.5,8.3 16.4,10.6 C18.5,11.6 20.2,11.3 21.8,9.8"/>
          </vector>
          XML
          cat > android/app/src/main/res/drawable/ic_notification_admin.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.8" android:pathData="M12,3 L20,6 V11 C20,16 16.6,20 12,22 C7.4,20 4,16 4,11 V6 Z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M12,7 L13.5,10.3 H17 L14.2,12.5 L15.2,16 L12,14 L8.8,16 L9.8,12.5 L7,10.3 H10.5 Z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M4,4 L7,6 L12,2 L17,6 L20,4 L18,9 H6 Z"/>
          </vector>
          XML
          cat > android/app/src/main/res/drawable/ic_notification_number.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.8" android:pathData="M6,2.8 H18 C19.7,2.8 21,4.1 21,5.8 V18.2 C21,19.9 19.7,21.2 18,21.2 H6 C4.3,21.2 3,19.9 3,18.2 V5.8 C3,4.1 4.3,2.8 6,2.8 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M9,7 L7.5,17 M15,7 L13.5,17 M6.5,10.5 H17.5 M6,14 H17"/>
          </vector>
          XML
          cat > android/app/src/main/res/drawable/ic_notification_otp.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.8" android:strokeLineJoin="round" android:pathData="M3,4 H16 C17.7,4 19,5.3 19,7 V13 C19,14.7 17.7,16 16,16 H10 L5,20 V16 H3 C1.3,16 0,14.7 0,13 V7 C0,5.3 1.3,4 3,4 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.8" android:pathData="M16,11 L21,13 V17 C21,19.5 19.3,21.2 16,23 C12.7,21.2 11,19.5 11,17 V13 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M13.5,17 L15.3,18.8 L18.7,15.3 M4.5,8 H14 M4.5,11 H11"/>
          </vector>
          XML
          cat > android/app/src/main/res/drawable/ic_notification_auto.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M20,8 C18.5,4.5 15.6,2.5 12,2.5 C7.6,2.5 4,5.6 3.2,9.7 M3,5 V10 H8 M4,16 C5.5,19.5 8.4,21.5 12,21.5 C16.4,21.5 20,18.4 20.8,14.3 M21,19 V14 H16"/>
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'com.google.firebase.messaging.default_notification_icon' not in s:
              meta = '<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_numelixa"/>'
              start = s.find('<application')
              end = s.find('>', start)
              if start < 0 or end < 0:
                  raise SystemExit('Could not locate Android application manifest element.')
              s = s[:end + 1] + '\\n        ' + meta + s[end + 1:]
          p.write_text(s)
          PY
      - name: Generate all twelve monochrome notification icons
        run: python3 scripts/generate_notification_icons.py
      - name: Install full-colour Numelixa notification artwork
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cat > android/app/src/main/res/drawable-nodpi/ic_notification_admin_color.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="64dp" android:height="64dp" android:viewportWidth="64" android:viewportHeight="64">
            <path android:fillColor="#071B62" android:strokeColor="#08BFFF" android:strokeWidth="3" android:pathData="M32,9 L55,18 V31 C55,45 45,55 32,61 C19,55 9,45 9,31 V18 Z"/>
            <path android:fillColor="#173DAB" android:strokeColor="#20E7FF" android:strokeWidth="2" android:pathData="M32,17 L48,23 V32 C48,42 41,49 32,54 C23,49 16,42 16,32 V23 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M32,25 L36,33 H45 L38,39 L41,48 L32,43 L23,48 L26,39 L19,33 H28 Z"/>
            <path android:fillColor="#FFB51B" android:strokeColor="#8A4A00" android:strokeWidth="1.4" android:pathData="M10,12 L17,18 L32,6 L47,18 L54,12 L50,25 L14,25 Z"/>
            <path android:fillColor="#FFD64A" android:strokeColor="#9A5600" android:strokeWidth="1" android:pathData="M10,8 A4,4 0,1 0,10 16 A4,4 0,1 0,10 8 Z"/>
            <path android:fillColor="#FFD64A" android:strokeColor="#9A5600" android:strokeWidth="1" android:pathData="M32,2 A4,4 0,1 0,32 10 A4,4 0,1 0,32 2 Z"/>
            <path android:fillColor="#FFD64A" android:strokeColor="#9A5600" android:strokeWidth="1" android:pathData="M54,8 A4,4 0,1 0,54 16 A4,4 0,1 0,54 8 Z"/>
          </vector>
          XML
          cat > android/app/src/main/res/drawable-nodpi/ic_notification_number_color.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="64dp" android:height="64dp" android:viewportWidth="64" android:viewportHeight="64">
            <path android:fillColor="#082D9C" android:strokeColor="#11DFFF" android:strokeWidth="3" android:pathData="M14,5 H50 C57,5 60,9 60,16 V48 C60,55 56,59 49,59 H15 C8,59 4,55 4,48 V16 C4,9 8,5 14,5 Z"/>
            <path android:fillColor="#0647D7" android:strokeColor="#168DFF" android:strokeWidth="1.5" android:pathData="M15,10 H49 C54,10 55,13 55,18 V46 C55,51 53,54 48,54 H16 C11,54 9,51 9,46 V18 C9,13 11,10 15,10 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M25,17 L30,17 L25,46 L20,46 Z M43,17 L48,17 L43,46 L38,46 Z M16,27 H49 V32 H15 Z M14,37 H47 V42 H13 Z"/>
            <path android:fillColor="#FFB51B" android:pathData="M42,43 H57 V58 H42 Z"/>
            <path android:fillColor="#FFE06B" android:pathData="M44,45 H49 V50 H44 Z M51,45 H55 V50 H51 Z M44,52 H49 V56 H44 Z M51,52 H55 V56 H51 Z"/>
          </vector>
          XML
          cat > android/app/src/main/res/drawable-nodpi/ic_notification_otp_color.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="64dp" android:height="64dp" android:viewportWidth="64" android:viewportHeight="64">
            <path android:fillColor="#F4F8FF" android:strokeColor="#0A55D9" android:strokeWidth="3" android:pathData="M8,8 H43 C49,8 53,12 53,18 V35 C53,41 49,45 43,45 H25 L12,56 V45 H8 C4,45 2,41 2,37 V18 C2,12 4,8 8,8 Z"/>
            <path android:fillColor="#123B9D" android:pathData="M16,23.5 A3.5,3.5 0,1 0,16 30.5 A3.5,3.5 0,1 0,16 23.5 Z"/>
            <path android:fillColor="#123B9D" android:pathData="M27,23.5 A3.5,3.5 0,1 0,27 30.5 A3.5,3.5 0,1 0,27 23.5 Z"/>
            <path android:fillColor="#123B9D" android:pathData="M38,23.5 A3.5,3.5 0,1 0,38 30.5 A3.5,3.5 0,1 0,38 23.5 Z"/>
            <path android:fillColor="#0755E8" android:strokeColor="#13D8FF" android:strokeWidth="2.5" android:pathData="M45,32 L61,38 V48 C61,56 55,61 45,64 C35,61 29,56 29,48 V38 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="4" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M37,48 L43,54 L54,41"/>
          </vector>
          XML
          cat > android/app/src/main/res/drawable-nodpi/ic_notification_auto_color.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="64dp" android:height="64dp" android:viewportWidth="64" android:viewportHeight="64">
            <path android:fillColor="#00000000" android:strokeColor="#087BFF" android:strokeWidth="9" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M52,25 C49,13 40,7 29,7 C18,7 10,14 7,25"/>
            <path android:fillColor="#087BFF" android:pathData="M5,12 L5,31 L23,31 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#B43BFF" android:strokeWidth="9" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M12,39 C15,51 24,57 35,57 C46,57 54,50 57,39"/>
            <path android:fillColor="#B43BFF" android:pathData="M59,52 L59,33 L41,33 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#16D8FF" android:strokeWidth="2" android:pathData="M32,15 A17,17 0,0 1,49 32 M32,49 A17,17 0,0 1,15 32"/>
          </vector>
          XML
      - name: Configure Firebase (optional)
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_CONFIG_B64" ]; then
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is required for the verified release build."
            exit 1
          fi
          echo "$FIREBASE_CONFIG_B64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('android/app/google-services.json')
          data = json.loads(p.read_text())
          ids = {c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in data.get('client', [])}
          if 'com.numelixa.app' not in ids:
              raise SystemExit('Firebase config must contain package com.numelixa.app; found: ' + str(ids))
          matching = [c for c in data.get('client', [])
                      if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.numelixa.app']
          oauth = [o for c in matching for o in c.get('oauth_client', [])]
          types = {str(o.get('client_type')) for o in oauth}
          if '1' not in types or '3' not in types:
              raise SystemExit(
                  'Firebase config is stale/incomplete: com.numelixa.app must include both Android OAuth client_type 1 and Web OAuth client_type 3. '
                  'Re-download google-services.json after registering the release SHA-1 and Web OAuth client, then update GitHub secret FIREBASE_GOOGLE_SERVICES_JSON_BASE64.'
              )
          android_clients = [o for o in oauth if str(o.get('client_type')) == '1']
          web_clients = [o for o in oauth if str(o.get('client_type')) == '3']
          malformed = [o.get('client_id', '') for o in android_clients + web_clients
                       if not str(o.get('client_id', '')).endswith('.apps.googleusercontent.com')]
          if malformed:
              raise SystemExit(
                  'Firebase OAuth client ID is malformed: every Android/Web OAuth client must end with '
                  '".apps.googleusercontent.com". Found invalid client ID(s): ' + ', '.join(map(str, malformed)) +
                  '. Download a fresh google-services.json from Firebase Console and update FIREBASE_GOOGLE_SERVICES_JSON_BASE64.'
              )
          g = Path('android/app/build.gradle.kts')
          s = g.read_text()
          marker = '    id("com.android.application")'
          if 'com.google.gms.google-services' not in s:
              s = s.replace(marker, marker + '\n    id("com.google.gms.google-services") version "4.4.2"', 1)
          g.write_text(s)
          PY
      - name: Configure release signing (optional)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_B64_PART1: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART1 }}
          KEYSTORE_B64_PART2: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART2 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          # Prefer two-part secrets to avoid mobile clipboard truncation. Otherwise use the original full secret.
          if [ -n "$KEYSTORE_B64_PART1" ] || [ -n "$KEYSTORE_B64_PART2" ]; then
            if [ -z "$KEYSTORE_B64_PART1" ] || [ -z "$KEYSTORE_B64_PART2" ]; then
              echo "::error::Both ANDROID_KEYSTORE_BASE64_PART1 and ANDROID_KEYSTORE_BASE64_PART2 must be set."
              exit 1
            fi
            printf '%s%s' "$KEYSTORE_B64_PART1" "$KEYSTORE_B64_PART2" | tr -d '[:space:]' > /tmp/keystore.base64
          else
            if [ -z "$KEYSTORE_B64" ]; then
              echo "::error::Set ANDROID_KEYSTORE_BASE64 or both split keystore secrets."
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' > /tmp/keystore.base64
          fi
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import sys
          raw = Path('/tmp/keystore.base64').read_bytes()
          invalid = sum(c not in b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=' for c in raw)
          print(f'Keystore Base64 diagnostics: characters={len(raw)}, invalid_characters={invalid}, length_mod_4={len(raw) % 4}')
          try:
              decoded = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit(f'ANDROID_KEYSTORE_BASE64 is malformed after GitHub provides it ({type(exc).__name__}). Re-copy the complete base64 file into this exact repository Actions secret.')
          if not decoded:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 decoded to an empty file.')
          Path('android/release-key.jks').write_bytes(decoded)
          PY
          if ! keytool -list -keystore android/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            rm -f android/release-key.jks
            echo "::error::Signing keystore could not be opened. Recreate ANDROID_KEYSTORE_BASE64 from the original .jks file and verify the keystore password and alias."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release-key.jks
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Diagnose Android OAuth signing configuration
        if: steps.signing.outputs.configured == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          echo "Release signing certificate SHA-1 (must be registered in Firebase Android OAuth):"
          keytool -list -v -keystore android/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E 'SHA1:|SHA-1:'
          RELEASE_SHA1="$(keytool -list -v -keystore android/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk '/SHA1:|SHA-1:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          RELEASE_SHA1="$RELEASE_SHA1" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data=json.loads(Path('android/app/google-services.json').read_text())
          release_sha1=os.environ['RELEASE_SHA1']
          matching=[c for c in data.get('client', [])
                    if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.numelixa.app']
          android_clients=[o for c in matching for o in c.get('oauth_client', []) if str(o.get('client_type')) == '1']
          print('OAuth clients bundled in Firebase config:')
          for client in matching:
              for oauth in client.get('oauth_client', []):
                  print('package=com.numelixa.app client_type=' + str(oauth.get('client_type')) + ' client_id=' + str(oauth.get('client_id', '')))
          configured={str(o.get('android_info', {}).get('certificate_hash', '')).replace(':', '').lower() for o in android_clients}
          if release_sha1 not in configured:
              raise SystemExit(
                  'Firebase google-services.json SHA-1 does not match the actual release keystore. '
                  'Actual release SHA-1: ' + release_sha1 + '. Register this SHA-1 in Firebase for com.numelixa.app, then download and update FIREBASE_GOOGLE_SERVICES_JSON_BASE64.'
              )
          print('Firebase Android OAuth SHA-1 matches the configured release signing key.')
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Build release APK
        run: flutter build apk --release --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Rename release APK for public downloads and updates
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Numelixa.apk
      - name: Build AAB
        run: flutter build appbundle --release --dart-define=NUMELIXA_API_BASE=https://www.numelixa.com
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: numelixa-android-builds
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/Numelixa.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Read app version for release metadata
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '"' | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Remove stale legacy APK from rolling release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'android-latest' }}"
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)"
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "app-release.apk") | .id' |
            while read -r ASSET_ID; do
              [ -n "$ASSET_ID" ] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
              echo "Removed stale legacy APK asset $ASSET_ID"
            done
          fi
      - name: Publish GitHub release assets
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'android-latest' }}
          target_commitish: ${{ github.sha }}
          name: Numelixa Android ${{ steps.app_version.outputs.version }}
          make_latest: true
          generate_release_notes: false
          overwrite_files: true
          body: |
            Numelixa — Global Virtual Numbers

            Major Numelixa mobile refresh: official globe-and-orbit app identity, redesigned premium sign-in and sign-up, updated notification status icon, stronger APK integrity checks, and official-domain in-app updates.

            Version ${{ steps.app_version.outputs.version }} keeps the existing Android package ID and uses the configured release signing key for in-place updates. Existing account data remains on the Numelixa service.

            Download Numelixa.apk to install or update the Android app. Do not uninstall an existing installation before updating.
          files: |
            build/app/outputs/flutter-apk/Numelixa.apk
            build/app/outputs/bundle/release/app-release.aab
